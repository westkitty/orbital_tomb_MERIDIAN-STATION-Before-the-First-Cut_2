name: Chromium smoke
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/timeline.test.mjs
      - run: node scripts/build.mjs
      - name: Serve + smoke (headless Chromium via npx playwright)
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright-core >/dev/null 2>&1 || true
          npx playwright install chromium --with-deps 2>/dev/null || npx playwright install chromium
          mkdir -p artifacts
          node scripts/smoke.mjs 2>&1 | tee artifacts/smoke.log; exit ${PIPESTATUS[0]}
      - name: Upload motion proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-motion-proof
          path: |
            artifacts/smoke.log
            artifacts/clip-a-first-cut.webm
            artifacts/clip-b-finale.webm
            artifacts/hand-contact.png
            docs/smoke-desktop.png
            docs/smoke-phone.png
